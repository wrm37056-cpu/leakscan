[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsweep"
version = "0.1.0"
description = "Scan files for accidentally committed secrets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
secretsweep = "secretsweep:main"

[tool.setuptools]
packages = ["secretsweep"]
